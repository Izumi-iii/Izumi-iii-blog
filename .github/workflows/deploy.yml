name: Build and deploy Hexo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Hexo site
        run: npm run build

      - name: Publish generated site
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_TOKEN"
          git -C public init
          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public add --all
          git -C public commit -m "Deploy Hexo site" || true
          git -C public branch -M main
          git -C public remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/Izumi-iii/Izumi-iii.github.io.git"
          git -C public push --force origin main
